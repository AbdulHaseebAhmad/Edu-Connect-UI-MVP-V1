name: Build and Deploy Frontend
on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build React app
        run: |
          npm run build 
          echo "echoing .env.prod"
          echo .env.production || true
          echo "echoing greps"
          grep -R "import.meta.env" src/ || true
          grep -R "undefined" src/ || true
          grep -R "api/sysadmin" dist/assets/ || true
        env:
          VITE_BACKEND_URL: /api
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geos-frontend
          path: dist 
  transfer_code:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: geos-frontend
          path: dist
      - name: Copy to bastion server
        run: |
          echo "${{ secrets.GEOS_BASTION_KEY_PAIR }}" > key.pem
          chmod 600 key.pem
          scp -o StrictHostKeyChecking=no -r -i key.pem dist ubuntu@52.72.143.27:/home/ubuntu/geos-frontend
      - name: SSH to Bastion and COPY to app servers
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@52.72.143.27 \
          "scp -o StrictHostKeyChecking=no -r -i ~/.ssh/geos_app_server.pem /home/ubuntu/geos-frontend ubuntu@10.5.4.97:/var/www/"
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@52.72.143.27  \
          "scp -o StrictHostKeyChecking=no -r -i ~/.ssh/geos_app_server.pem /home/ubuntu/geos-frontend ubuntu@10.5.2.195:/var/www/"
